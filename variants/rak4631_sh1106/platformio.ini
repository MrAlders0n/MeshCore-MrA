; RAK4631 companion firmware for a 1.3" SH1106 OLED (e.g. MakerFocus)
; instead of the stock 0.96" SSD1306. Extends the upstream RAK4631 envs so
; only the display driver changes.

[rak4631_sh1106]
build_unflags =
  -D DISPLAY_CLASS=SSD1306Display
build_flags =
  -D DISPLAY_CLASS=SH1106Display
  -D USE_SH1106
build_src_filter =
  +<helpers/ui/SH1106Display.cpp>
lib_deps =
  adafruit/Adafruit SH110X @ ~2.1.13

[env:RAK_4631_companion_radio_usb_sh1106]
extends = env:RAK_4631_companion_radio_usb
build_unflags = ${rak4631_sh1106.build_unflags}
build_flags =
  ${env:RAK_4631_companion_radio_usb.build_flags}
  ${rak4631_sh1106.build_flags}
build_src_filter =
  ${env:RAK_4631_companion_radio_usb.build_src_filter}
  ${rak4631_sh1106.build_src_filter}
lib_deps =
  ${env:RAK_4631_companion_radio_usb.lib_deps}
  ${rak4631_sh1106.lib_deps}

[env:RAK_4631_companion_radio_ble_sh1106]
extends = env:RAK_4631_companion_radio_ble
build_unflags = ${rak4631_sh1106.build_unflags}
build_flags =
  ${env:RAK_4631_companion_radio_ble.build_flags}
  ${rak4631_sh1106.build_flags}
build_src_filter =
  ${env:RAK_4631_companion_radio_ble.build_src_filter}
  ${rak4631_sh1106.build_src_filter}
lib_deps =
  ${env:RAK_4631_companion_radio_ble.lib_deps}
  ${rak4631_sh1106.lib_deps}
