name: Build Custom Firmwares

# Watches upstream MeshCore for new release tags and rebuilds each custom
# firmware listed in .github/custom-builds.json on top of them.
#
# For every build whose upstream tag prefix (companion, repeater, room-server)
# has a new release, the commits on that build's branch are cherry-picked on
# top of the upstream tag, its pio envs are built (with any extra build flags),
# and a GitHub Release named "<name>-<upstream tag>" is published here.
#
# Each branch must be based on upstream history and should only contain the
# custom commits. Anything on it that is not already in upstream is applied.
#
# custom-builds.json fields:
#   name             release tag prefix, e.g. rak-custom-display
#   title            release title prefix
#   branch           branch holding the custom commits
#   upstream_prefix  upstream tag type to follow: companion, repeater, room-server
#   envs             space separated pio envs to build
#   extra_flags      extra build flags added to every env (may be empty)
#
# Optional repository variable (Settings > Secrets and variables > Variables):
#   UPSTREAM_REPO    default: meshcore-dev/MeshCore

permissions:
  contents: write

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Only this build name from custom-builds.json. Empty = all builds.'
        required: false
        default: ''
      tag:
        description: 'Upstream tag to build (e.g. repeater-v1.17.1). Empty = latest tag for each build.'
        required: false
        default: ''
      force:
        description: 'Rebuild even if a release already exists'
        type: boolean
        default: false

concurrency:
  group: custom-firmwares
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'meshcore-dev/MeshCore' }}

jobs:

  find-new-releases:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/custom-builds.json
          sparse-checkout-cone-mode: false

      - name: Find Upstream Tags To Build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          UPSTREAM_TAGS=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" | awk '{print $2}' | sed 's#^refs/tags/##')

          if [ -n "$INPUT_TAG" ] && ! grep -qxF "$INPUT_TAG" <<< "$UPSTREAM_TAGS"; then
            echo "::error::Tag '$INPUT_TAG' not found in ${UPSTREAM_REPO}"
            exit 1
          fi

          MATRIX="[]"
          MATCHED=0
          while IFS= read -r BUILD; do
            NAME=$(jq -r '.name' <<< "$BUILD")
            PREFIX=$(jq -r '.upstream_prefix' <<< "$BUILD")

            [ -n "$INPUT_BUILD" ] && [ "$INPUT_BUILD" != "$NAME" ] && continue

            if [ -n "$INPUT_TAG" ]; then
              [[ "$INPUT_TAG" =~ ^${PREFIX}-v[0-9] ]] || continue
              TAG="$INPUT_TAG"
            else
              # only the newest release, so a new build doesn't backfill history
              TAG=$(grep -E "^${PREFIX}-v[0-9]+(\.[0-9]+)*$" <<< "$UPSTREAM_TAGS" | sort -V | tail -n 1)
              if [ -z "$TAG" ]; then
                echo "::warning::No upstream ${PREFIX} tags found for $NAME"
                continue
              fi
            fi
            MATCHED=$((MATCHED + 1))

            RELEASE_TAG="${NAME}-${TAG}"
            if [ "$INPUT_FORCE" != "true" ] && gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Skipping $NAME for $TAG, release $RELEASE_TAG already exists"
              continue
            fi

            echo "Queueing $NAME for $TAG"
            MATRIX=$(jq -c \
              --argjson build "$BUILD" --arg tag "$TAG" --arg version "${TAG##*-}" --arg release_tag "$RELEASE_TAG" \
              '. + [$build + {upstream_tag: $tag, version: $version, release_tag: $release_tag}]' <<< "$MATRIX")
          done < <(jq -c '.[]' .github/custom-builds.json)

          if [ "$MATCHED" -eq 0 ] && { [ -n "$INPUT_BUILD" ] || [ -n "$INPUT_TAG" ]; }; then
            echo "::error::No build in custom-builds.json matches build='$INPUT_BUILD' tag='$INPUT_TAG'"
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: find-new-releases
    if: needs.find-new-releases.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    name: build (${{ matrix.release_tag }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.find-new-releases.outputs.matrix) }}
    steps:

      - name: Clone Custom Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Apply Custom Commits To Upstream Tag
        env:
          UPSTREAM_TAG: ${{ matrix.upstream_tag }}
          PATCH_BRANCH: ${{ matrix.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream \
            '+refs/heads/*:refs/remotes/upstream/*' \
            "+refs/tags/${UPSTREAM_TAG}:refs/upstream-tags/${UPSTREAM_TAG}"

          PATCH_SHA=$(git rev-parse HEAD)

          # custom commits = everything on the branch that upstream doesn't have
          COMMITS=$(git rev-list --reverse --no-merges HEAD --not --remotes=upstream --glob='refs/upstream-tags/*')
          if [ -z "$COMMITS" ]; then
            echo "::error::Branch '${PATCH_BRANCH}' has no commits that aren't already in ${UPSTREAM_REPO}"
            exit 1
          fi

          echo "Applying onto ${UPSTREAM_TAG}:"
          git log --no-walk=unsorted --oneline $COMMITS

          git checkout --detach "refs/upstream-tags/${UPSTREAM_TAG}"
          if ! git cherry-pick --keep-redundant-commits $COMMITS; then
            git status
            echo "::error::Custom commits from '${PATCH_BRANCH}' don't apply cleanly to ${UPSTREAM_TAG}. Update the branch and re-run."
            exit 1
          fi

          {
            echo "PATCH_SHA=${PATCH_SHA}"
            echo "UPSTREAM_SHA=$(git rev-parse "refs/upstream-tags/${UPSTREAM_TAG}^{commit}")"
            echo "APPLIED_COMMITS<<EOF"
            git log --no-walk=unsorted --format='- %h %s' $COMMITS
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Init Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ matrix.version }}
          BUILD_ENVS: ${{ matrix.envs }}
          # build.sh appends its version flags to these
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.extra_flags }}
        run: |
          for ENV in $BUILD_ENVS; do
            /usr/bin/env bash build.sh build-firmware "$ENV"
          done
          ls -l out

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: out

      - name: Remove Existing Release
        if: inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ matrix.release_tag }}" -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release_tag }}
          # built commit only exists on the runner, so tag the custom branch commit it came from
          target_commitish: ${{ env.PATCH_SHA }}
          name: ${{ matrix.title }} ${{ matrix.version }}
          body: |
            ${{ matrix.title }} build of upstream [`${{ matrix.upstream_tag }}`](https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ matrix.upstream_tag }}).

            - Upstream commit: ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_SHA }}
            - Custom branch: `${{ matrix.branch }}` @ ${{ env.PATCH_SHA }}
            - Envs: `${{ matrix.envs }}`
            - Extra build flags: `${{ matrix.extra_flags || 'none' }}`

            Custom commits applied:
            ${{ env.APPLIED_COMMITS }}
          files: out/*
